name: Gowes
options:
  bundleIdPrefix: my.idubma
  deploymentTarget:
    iOS: "12.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Gowes:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: my.idubma.gowes
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Gowes
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocationWhenInUseUsageDescription: Untuk menghitung kecepatan, jarak, dan merekam jalur gowes.
        NSLocationAlwaysAndWhenInUseUsageDescription: Untuk menghitung kecepatan, jarak, dan merekam jalur gowes.
        NSLocationAlwaysUsageDescription: Untuk menghitung kecepatan, jarak, dan merekam jalur gowes.
        NSBluetoothAlwaysUsageDescription: Untuk menyambung ke sensor detak jantung.
        NSBluetoothPeripheralUsageDescription: Untuk menyambung ke sensor detak jantung.
