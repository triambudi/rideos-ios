name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Periksa Xcode
        run: xcodebuild -version
      - name: Pasang XcodeGen dan ldid
        run: brew install xcodegen ldid
      - name: Generate project
        run: xcodegen generate
      - name: Build tanpa signing
        run: |
          xcodebuild -project Gowes.xcodeproj -scheme Gowes \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Bungkus jadi IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Gowes.app Payload/
          ldid -S Payload/Gowes.app/Gowes
          zip -qry Gowes.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Gowes-ipa
          path: Gowes.ipa
